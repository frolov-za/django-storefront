{% load static %}

<!DOCTYPE html>

<html lang="ru">

<head>

    <link rel="shortcut icon"
          href="{% static 'img/favicon.ico' %}"
          type="image/x-icon">

    <link rel="apple-touch-icon"
          sizes="180x180"
          href="{% static 'img/apple-touch-icon.png' %}">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StoreFront - ZPL Diagnostics Error</title>


    <style>

        body {

            background-color: #121212;

            color: #e0e0e0;

            margin: 0;

            font-family: sans-serif;

        }


        .content-wrapper {

            padding-top: 15px;

            max-width: 1200px;

            margin: 0 auto;

            padding-left: 15px;

            padding-right: 15px;

            box-sizing: border-box;

        }


        .container {

            background-color: #1b1b1b;

            border-radius: 16px;

            padding: 30px;

            box-shadow:
                0 0 10px rgba(0, 0, 0, 0.4);

            border: 1px solid #333;

            width: 100%;

            margin: 0 auto;

            box-sizing: border-box;

            overflow: hidden;

        }


        /*
         * Верхняя панель.
         *
         * Кнопка назад находится
         * внутри контейнера и всегда слева.
         */

        .top-bar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 25px;

        }


        /*
         * Кнопка навигации.
         */

        .navigation-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 10px 16px;

            background-color: #2d2d2d;

            color: #e0e0e0;

            border: 1px solid #444;

            border-radius: 6px;

            text-decoration: none;

            font-size: 14px;

            cursor: pointer;

            white-space: nowrap;

            transition:
                background-color 0.2s,
                transform 0.2s;

        }


        .navigation-button:hover {

            background-color: #3d3d3d;

            transform: translateY(-1px);

        }


        /*
         * Заголовок ошибки.
         */

        h1 {

            margin-top: 0;

            margin-bottom: 15px;

            color: #ff5252;

            font-size: 26px;

        }


        /*
         * Текст ошибки.
         */

        .error-message {

            margin: 0;

            padding: 15px;

            background-color: #2d1717;

            border: 1px solid #6d2929;

            border-radius: 8px;

            color: #ffdddd;

            line-height: 1.6;

            overflow-wrap: anywhere;

            word-break: break-word;

        }


        /*
         * Мобильная версия.
         */

        @media (max-width: 600px) {

            .content-wrapper {

                padding-left: 10px;

                padding-right: 10px;

            }


            .container {

                padding: 20px;

            }


            .navigation-button {

                padding: 9px 12px;

                font-size: 13px;

            }


            h1 {

                font-size: 22px;

            }

        }

    </style>

</head>


<body>


<div class="content-wrapper">

    <div class="container">


        <!-- Верхняя панель -->

        <div class="top-bar">

            <a href="/"
               class="navigation-button">

                ⬅️ Назад

            </a>

        </div>


        <!-- Ошибка -->

        <h1>
            Ошибка при подключении к принтеру
        </h1>


        <p class="error-message">
            {{ error }}
        </p>


    </div>

</div>


</body>

</html>

<!DOCTYPE html>
<html>
<head>
    <title>Статистика продаж</title>
    <style>
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Статистика продаж напитков</h1>
    
    <h2>За последние 24 часа: {{ daily_total|floatformat:2 }} л</h2>
    <h2>За последние 7 дней: {{ weekly_total|floatformat:2 }} л</h2>

    <h3>Детализация по дням:</h3>
    <table>
        <thead>
            <tr>
                <th>Дата</th>
                <th>Объем (л)</th>
            </tr>
        </thead>
        <tbody>
            {% for day in daily_breakdown %}
            <tr>
                <td>{{ day.date }}</td>
                <td>{{ day.total|floatformat:2 }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>

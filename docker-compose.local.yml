services:

  # ============================================================
  # Build Django image locally
  # ============================================================

  app:
    image: storefront:local
    build:
      context: ./app


  # ============================================================
  # Django migration
  # ============================================================

  migrate:
    image: storefront:local
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["python", "manage.py", "migrate", "--noinput"]
    env_file:
      - .env_docker
    restart: "no"


  # ============================================================
  # Django
  # ============================================================

  web:
    image: storefront:local
    container_name: django-web
    volumes:
      - ./data:/app/data
      - static_volume:/app/staticfiles
      - ./media:/app/media
      - uwsgi-socket:/tmp/uwsgi
      - ./logs:/app/logs
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn storefront.wsgi:application --bind 0.0.0.0:8000"
    expose:
      - 8000
    env_file:
      - .env_docker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully


  # ============================================================
  # Celery Beat
  # ============================================================

  celery_beat:
    image: storefront:local
    container_name: django-celery_beat
    volumes:
      - ./data:/app/data
      - static_volume:/app/staticfiles
      - ./media:/app/media
      - ./logs:/app/logs
    command: ["celery", "-A", "storefront", "beat", "--loglevel=info"]
    env_file:
      - .env_docker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully


  # ============================================================
  # Celery Worker
  # ============================================================

  celery_worker:
    image: storefront:local
    container_name: django-celery_worker
    volumes:
      - ./data:/app/data
      - static_volume:/app/staticfiles
      - ./media:/app/media
#      - /mnt/usb:/tmp/backup
      - ./logs:/app/logs
    command: ["celery", "-A", "storefront", "worker", "--loglevel=info"]
    env_file:
      - .env_docker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully


  # ============================================================
  # Redis
  # ============================================================

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]


  # ============================================================
  # Nginx
  # ============================================================

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/nginx/certs
      - ./media:/media
      - ./docs:/docs
      - static_volume:/app/staticfiles
      - uwsgi-socket:/tmp/uwsgi
    restart: unless-stopped
    depends_on:
      - web


volumes:
  uwsgi-socket:
  redis-data:
  static_volume:
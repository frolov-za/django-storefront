services:
  migrate:
    build: ./app
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["python", "manage.py", "migrate", "--noinput"]
    env_file:
      - .env_docker
    restart: "no"

  web:
    build: ./app
    container_name: django-web
    volumes:
      - ./data:/app/data
      - static_volume:/app/staticfiles
      - ./media:/app/media
      - uwsgi-socket:/tmp/uwsgi
      - ./logs:/app/logs
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn storefront.wsgi:application --bind 0.0.0.0:8000"
    expose:
      - 8000
    env_file:
      - .env_docker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  celery_beat:
    build: ./app
    container_name: django-celery_beat
    volumes:
      - ./data:/app/data
      - static_volume:/app/staticfiles
      - ./media:/app/media
      - ./logs:/app/logs
    command: ["celery", "-A", "storefront", "beat", "--loglevel=info"]
    env_file:
      - .env_docker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  celery_worker:
    container_name: django-celery_worker
    build: ./app
    volumes:
      - ./data:/app/data
      - static_volume:/app/staticfiles
      - ./media:/app/media
#      - /mnt/usb:/tmp/backup #For local BackUps 
      - ./logs:/app/logs
    command: ["celery", "-A", "storefront", "worker", "--loglevel=info"]
    env_file:
      - .env_docker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/nginx/certs
      - ./media:/media
      - ./docs:/docs
      - static_volume:/app/staticfiles
      - uwsgi-socket:/tmp/uwsgi
    restart: unless-stopped
    depends_on:
      - web

volumes:
  uwsgi-socket:
  redis-data:
  static_volume:
